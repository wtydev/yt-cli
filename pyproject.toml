[project]
name = "yt-cli"
version = "0.1.0"
description = "Analytics, uploads and comments for your own YouTube channels"
readme = "README.md"
authors = [
    { name = "Terry Wang", email = "github@wtymx.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
]

[project.scripts]
yt = "yt_cli.cli:main"
yt-mcp = "yt_cli.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp>=2.3.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
